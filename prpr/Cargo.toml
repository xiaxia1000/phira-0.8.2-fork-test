[package]
name = "prpr"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lib]

[features]
default = ["log"]
video = ["dep:prpr-avc"]
log = ["dep:tracing-subscriber", "dep:colored"]
closed-source-libs = [
	"base64",
	"fluent",
	"fluent-syntax",
	"hex",
	"hmac",
	"intl-memoizer",
	"lru",
	"miniz_oxide",
	"obfstr",
	"sha2",
	"subtle",
	"symphonia",
	"sys-locale",
	"unic-langid",
	"uuid",
]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true, optional = true }
bitflags = { workspace = true, features = ["serde"] }
byteorder = "1.5.0"
cfg-if = "1.0.4"
chardetng = "0.1.17"
chrono = { workspace = true, features = ["serde"] }
color-thief = "0.2.2"
colored = { version = "3.1.1", optional = true }
concat-string = "1.0.1"
csv = "1.4.0"
fastblur = "0.1.1"
fluent = { workspace = true, optional = true }
fluent-syntax = { workspace = true, optional = true }
glyph_brush = "0.7.12"
hex = { workspace = true, optional = true }
hmac = { version = "0.12.1", optional = true }
image = { workspace = true, default-features = false, features = [
	"bmp",
	"gif",
	"jpeg",
	"png",
	"rayon",
	"webp",
] }
inputbox = { workspace = true }
intl-memoizer = { version = "0.5.3", optional = true }
libc = "0.2.183"
lru = { workspace = true, optional = true }
lyon = { workspace = true }
atomic_float = "1.1.0"

macroquad = { workspace = true, default-features = false }
miniquad = { workspace = true }
miniz_oxide = { version = "0.9.1", optional = true }
nalgebra = { workspace = true }
obfstr = { version = "0.4.4", optional = true }
once_cell = { workspace = true }
ordered-float = "5.1.0"
phf = { version = "0.13.1", features = ["macros"] }
prpr-auto-offset = { workspace = true }
prpr-avc = { workspace = true, optional = true }
prpr-l10n = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true, optional = true }
subtle = { version = "2.6.1", optional = true }
symphonia = { version = "0.5", features = [
	"flac",
	"mp3",
	"ogg",
	"vorbis",
	"wav",
	"pcm",
], optional = true }
sys-locale = { workspace = true, optional = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
unic-langid = { version = "0.9.6", features = ["macros"], optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }
zip = { workspace = true, default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_env = "ohos")))'.dependencies]
sasa = { workspace = true, default-features = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_env = "ohos")))'.dependencies]
open = "5.3.3"
rfd = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "*"
tokio = { workspace = true }
wasm-bindgen = "*"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
	"Location",
	"Performance",
	"UrlSearchParams",
	"Window",
] }

[target.'cfg(target_env = "ohos")'.dependencies]
sasa = { workspace = true, default-features = false, features = ["ohos"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22.4"
ndk-context = "0.1"
sasa = { workspace = true, default-features = false, features = ["oboe"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { workspace = true }
objc2-foundation = { workspace = true }
objc2-ui-kit = { workspace = true, features = ["objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { workspace = true }

[build-dependencies]
# walkdir = { workspace = true }

[dev-dependencies]
# walkdir = { workspace = true }

[lints]
workspace = true
